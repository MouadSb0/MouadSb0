<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <!-- Dark Ocean Gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000B18" /> <!-- Abyssal Black-Blue -->
      <stop offset="50%" stop-color="#001F3F" /> <!-- Navy -->
      <stop offset="100%" stop-color="#003366" /> <!-- Deep Ocean Blue -->
    </linearGradient>
    
    <!-- Slightly lighter layer for depth -->
    <linearGradient id="backWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001224" />
      <stop offset="100%" stop-color="#002B4D" />
    </linearGradient>
  </defs>

  <!-- Base background (Deepest ocean floor) -->
  <rect width="100%" height="100%" fill="#00060D" />

  <!-- Background wave layer (adds depth) -->
  <path d="M 0 90 Q 250 10 500 70 T 1000 80 L 1000 200 L 0 200 Z" fill="url(#backWaveGrad)" opacity="0.6" />

  <!-- Foreground wave layer (Main shape matching your image) -->
  <path d="M 0 110 C 300 -10, 700 190, 1000 70 L 1000 200 L 0 200 Z" fill="url(#oceanGrad)" />
</svg>
